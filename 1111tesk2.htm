<!DOCTYPE HTML>
<html>

<head>
    <title> 웹프 홈페이지</title>
    <script>
        function changeContent4() {
            let d = new Date();
            let h = d.getHours();
            if (6 < h && h < 21){
                document.body.style.backgroundColor = "skyblue";
            }
            else{
                document.body.style.backgroundColor = "lightgray";
            }

        }
        function changeContent5() {
            let bodyTag = document.querySelector("body");
            let ulTag = document.querySelector("ul");
            let imgTag = document.createElement("img");
            imgTag.setAttribute("src", "jjcse.png");
            imgTag.style.display = "block";
            bodyTag.insertBefore(imgTag , ulTag);
        }
    </script>
</head>

<body>
    <h1> Welcome! </h1>
    <h3><a href='http://www.jj.ac.kr'> 전주대학교 </a></h3>
    <h3> 컴퓨터공학 전공과목</h3>
    <ul>
        <li> 데이터베이스 </li>
        <li> 컴퓨터 구조</li>
        <li> 알고리즘 </li>
    </ul>
    <hr>
    <button onclick="changeContent4();"> 버튼4</button>
    <button onclick="changeContent5();"> 버튼5</button>
</body>

</html>
