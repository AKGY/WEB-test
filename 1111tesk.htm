<!DOCTYPE HTML>
<html>

<head>
    <title>웹프 홈페이지</title>
    <script>
        function changeContent1() {
            let t1 = document.querySelector("a");
            t1.href = "https://sw.jj.ac.kr";
            t1.innerText = "전주대 소융대";
        }
        function changeContent2() {
            let ulTag = document.querySelector("ul");
            let lis = document.querySelectorAll("li");
            let algo = lis[2];
            let spTag = document.createElement('li');
            let dsTag = document.createElement("li");
            let spText = document.createTextNode("소프트웨어 프로젝트");
            let dsText = document.createTextNode("자료구조");
            spTag.appendChild(spText);
            dsTag.appendChild(dsText);
            
            ulTag.appendChild(spTag);
            ulTag.insertBefore(dsTag, algo);

            
        }
        function changeContent3() {
            let ulTag = document.querySelector("ul");
            let dbTag = document.querySelector('li');
            ulTag.removeChild(dbTag);
        }
    </script>

    <head>

    <body>

        <h1> Welcome! </h1>
        <h3><a href="http://www.jj.ac.kr">전주대!</a></h3>
        <h3>컴퓨터공학 전공과목</h3>
        <ul>
            <li>데이터베이스</li>
            <li>컴퓨터 구조</li>
            <li>알고리즘</li>
        </ul>
        <hr>
        <button onclick="changeContent1();"> 버튼1</button>
        <button onclick="changeContent2();"> 버튼2</button>
        <button onclick="changeContent3();"> 버튼3</button>
    </body>

</html>
