    <h2>JS의 사용자 입력</h2>
    <script>
        alert("졸지마! 정신차려!");  <!--사용자의 "확인" 입력-->
        answer = confirm("당신은 조동영 교수를 좋아하니요?");  <!--Yes/No,true/false 의 응답-->
        if (answer ==true){
            document.write("조동영 교수를 좋아합니다.");
        }
        else{
            document.write("조동영 교수를 좋아하지 않습니다.");
        }
