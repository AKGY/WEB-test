<!DOCTYPE HTML>
<html>

<head>
    <title>
        CSS 스타일시트 실습
    </title>
    <style>
        div {width: 100px; height: 100px;}
        #co {border: 1px red solid; width: 500; height: 400;}
        #b0 {background-color: gray; margin: 10px;}
        #b1 {
            background-color: aqua; 
            position: absolute;
            top: 30px;
            left: 30px; 
            }
        #b2 {background-color: lightgray;}
       



        #menu {
            width: 200px; 
            height: 500px; 
            background: skyblue;
            padding: 20px;
        }

        as {
            background: orange;
            margin: 30px;
            display: inline-block;
            width: 100px;
            height: 50px;
            padding: 10px;
            border: 5px black solid;
        }
        #m1:hover{background-color: red;}

    </style>

</head>

<body>
    <div id="co">
        <div id="b0">박스0</div>
        <div id="b1">박스1</div>
        <div id="b2">박스2</div>
    </div>
    <hr><hr>

    <div id="menu">
        <as id = "m0" href="">메뉴0</as>
        <as id = "m1" href="">메뉴1</as>
        <as id = "m2" href="">메뉴2</as>
    </div>
  
    <a href="../index.htm">홈으로</a>
    
 </body>

</html>
