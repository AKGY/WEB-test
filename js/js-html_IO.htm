<!DOCTYPE HTML>
<html>

<head>
    <title>
        HTML 입력양식
    </title>
    <style>

    </style>
</head>

<body>
    <h3>로그인 HTML 입력양식</h3><hr>
    <form>
        아이디 <input type="text" name="userID" id="id" value="아이디" /><br>
        비밀번호 <input type="password" name="userPW" id="pw" /><br>
        학년 : 
            <input type="radio" name="year" id="year1" value="1"> 1학년<!--name이 똑같다 그래야 radioButton처럼 작동-->
            <input type="radio" name="year" id="year2" value="2" checked> 2학년
            <input type="radio" name="year" id="year3" value="3"> 3학년
            <input type="radio" name="year" id="year4" value="4"> 4학년<br>
        성별 :
            <input type="radio" name="gender" id="g1" value="man"> 남성
            <input type="radio" name="gender" id="g2" value="woman"> 여성<br>
        취미 :
            <input type="checkbox" name="hobby" id="h1" vlaue="음악">  음악감상
            <input type="checkbox" name="hobby" id="h2" vlaue="운동">  운동
            <input type="checkbox" name="hobby" id="h3" vlaue="독서">  독서
            <input type="checkbox" name="hobby" id="h4" vlaue="게임">  게임
            <input type="checkbox" name="hobby" id="h5" vlaue="악기">  악기연주
            <input type="checkbox" name="hobby" id="h6" vlaue="TV">  TV시청
            <input type="checkbox" name="hobby" id="h7" vlaue="바둑">  바둑
            <input type="checkbox" name="hobby" id="h8" vlaue="영화">  영화관람<br>

        제출 파일명 :
            <input type="file" name="file1"><br>

        <input type="submit" value="로그인"/>&nbsp;&nbsp;<!--button태그로 대체가능 <button type="submit" "reset">-->
        <input type="reset" value="모두 지우기"/>&nbsp;&nbsp;
        <button id="b1">JS코드 실행</button>
    </form>





        <br><br><hr><hr/>
        <button onclick="location.href='../index.htm';">홈으로</button>
</body>

</html>
