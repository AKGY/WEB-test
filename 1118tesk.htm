<!DOCTYPE HTML>
<html>

<head>
    <title>입력양식</title>
</head>

<body>
    <h1>회원 정보</h1>
    <form style="width: 500px;">
        <hr>
        <hr />
        <fieldset>
            <legend>인적사항</legend>

            이름 : <input type="text" name="sName" id="n1" placeholder="ID 입력요망">
            주민번호 : <input type="text" name="KRN1" id="birth" size="6" maxlength="6">-<input type="password" name="KRN2"
                id="krnB" size="7" maxlength="7">
            <br>
            국적 :
            <select name="country">
                <option value="0"> 내국인(대한민국) </option>
                <option value="1"> 외국인 </option>
            </select>
            <br>

            취득 자격증 :
            <select name="ja" size="1" multiple>
                <option value="infoProc" selected>정보처리기사</option>
                <option value="infoSecu">정보보안기사</option>
                <option value="comSpec">컴퓨터활용능력 1급</option>
                <option value="linux1">리눅스마스터 1급</option>
                <option value="linux2">리눅스마스터 2급</option>
                <option value="net1">네트워크관리사 1급</option>
                <option value="net2">네트워크관리사 2급</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>성별 & 학년</legend>
            성별 :
            <input type="radio" name="gender" id="g1" value="m"> 남성
            <input type="radio" name="gender" id="g2" value="w"> 여성<br>
            학년 :
            <input type="radio" name="year" id="year1" value="1"> 1학년
            <input type="radio" name="year" id="year2" value="2" checked> 2학년
            <input type="radio" name="year" id="year3" value="3"> 3학년
            <input type="radio" name="year" id="year4" value="4"> 4학년<br>
        </fieldset>
        <fieldset>
            <legend>취미</legend>
            <input type="checkbox" name="hobby" id="h1" vlaue="독서"> 독서
            <input type="checkbox" name="hobby" id="h2" vlaue="바둑"> 바둑
            <input type="checkbox" name="hobby" id="h3" vlaue="골프"> 골프
            <input type="checkbox" name="hobby" id="h4" vlaue="등산"> 등산
            <input type="checkbox" name="hobby" id="h5" vlaue="여행"> 여행
            <input type="checkbox" name="hobby" id="h6" vlaue="기타"> 기타<br>
        </fieldset>
        <fieldset>
            <legend>메모사항</legend>
            <textarea rows="3" cols="62" name="memo" placeholder="&#xA;&nbsp;&nbsp;&nbsp;메모글을 남겨주세요"></textarea>
        </fieldset>
        <br>
        첨부 서류 : <input type="file" name="file1"><br>
        <hr>
        <input type="submit" value="저장하기">
        <input type="reset" value="다시 입력하기">
    </form>
</body>

</html>
